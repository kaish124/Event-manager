jwt.secret=a06acb34bffd66d8fe4766182f96a49e2ff5eb7694adb1340991c279d3479c213dffbf8dc2010411
jwt.issuer=https://events.reza.com

jwt.expiry-second=3600

spring.session.store-type=none

spring.datasource.url=jdbc:postgresql://localhost:5432/EventsManagemnet
spring.datasource.username=postgres
spring.datasource.password=reza2580
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.reza.events=TRACE
logging.level.com.reza.events.auth=TRACE
logging.level.com.reza.events.auth.security=TRACE
logging.level.com.reza.events.controller=TRACE
logging.level.com.reza.events.service=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Console logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Enable detailed error messages
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false